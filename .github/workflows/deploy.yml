name: Build and deploy .NET application to Container App silo

on:
  push:
    branches:
    - deploy

env:
  
  # alphanumeric string under 14 characters
  RESOURCE_GROUP_NAME: hungdangacarg006

  # specify your preferred region
  REGION: southeastasia
  TF_WORKING_DIR: Azure/NewVersion3/terraform
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

  SILO_DOCKER_FILE_PATH: Silo/Dockerfile
  SILO_IMAGE_NAME: silo

  DASHBOARD_DOCKER_FILE_PATH: Dashboard/Dockerfile
  DASHBOARD_IMAGE_NAME: dashboard

  MINIMAL_CLIENT_DOCKER_FILE_PATH: Clients.MinimalApi/Dockerfile
  MINIMAL_CLIENT_IMAGE_NAME: minimalapiclient

  WORKERSERVICE_CLIENT_DOCKER_FILE_PATH: Clients.WorkerService/Dockerfile
  WORKERSERVICE_CLIENT_IMAGE_NAME: workerserviceclient

  SCALER_DOCKER_FILE_PATH: Scaler/Dockerfile
  SCALER_IMAGE_NAME: scaler

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      acr_login_server: ${{ steps.tf_output.outputs.acr_login_server }}

    steps:

    - name: Checkout to the branch
      uses: actions/checkout@v2

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AzureSPN }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Restore Terraform plugin cache
      uses: actions/cache@v4
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: ${{ runner.os }}-terraform-${{ hashFiles('Azure/NewVersion3/terraform/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-

    - name: Create Terraform plugin cache directory
      run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

    - name: Create resource group
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Creating resource group in Azure"
          echo "Executing 'az group create -l ${{ env.REGION }} -n ${{ env.RESOURCE_GROUP_NAME }}'"

          az group create -l ${{ env.REGION }} -n ${{ env.RESOURCE_GROUP_NAME }}

    - name: Terraform plan
      run: |
        set -euo pipefail
        echo "Planning resources with Terraform"
        terraform -chdir=${{ env.TF_WORKING_DIR }} init -input=false
        terraform -chdir=${{ env.TF_WORKING_DIR }} plan -input=false -out=tfplan \
          -var="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
          -var="location=${{ env.REGION }}"

    - name: Terraform apply
      if: github.ref == 'refs/heads/deploy'
      run: |
        set -euo pipefail
        echo "Applying Terraform plan"
        terraform -chdir=${{ env.TF_WORKING_DIR }} apply -input=false -auto-approve tfplan

    - name: Read Terraform outputs
      id: tf_output
      run: |
        set -euo pipefail
        ACR_LOGIN_SERVER=$(terraform -chdir=${{ env.TF_WORKING_DIR }} output -raw acr_login_server)
        if [ -z "$ACR_LOGIN_SERVER" ]; then
          echo "acr_login_server output is empty"
          exit 1
        fi
        echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: provision
    
    steps:

    - name: Checkout to the branch
      uses: actions/checkout@v2

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AzureSPN }}

    - name: Set ACR Login Server from provision output
      run: echo "ACR_LOGIN_SERVER=${{ needs.provision.outputs.acr_login_server }}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to ACR
      run: |
        set -euo pipefail
        ACR_LOGIN_SERVER="${{ needs.provision.outputs.acr_login_server }}"
        # see https://cloudarchitected.com/2021/09/logging-into-acr-in-github-actions/
        # see https://github.com/Azure/acr/blob/main/docs/AAD-OAuth.md#calling-post-oauth2exchange-to-get-an-acr-refresh-token
        access_token=$(az account get-access-token --query accessToken -o tsv)
        refresh_token=$(curl https://$ACR_LOGIN_SERVER/oauth2/exchange -v -d "grant_type=access_token&service=$ACR_LOGIN_SERVER&access_token=$access_token" | jq -r .refresh_token)
        # The null GUID 0000... tells the container registry that this is an ACR refresh token during the login flow
        docker login -u 00000000-0000-0000-0000-000000000000 --password-stdin $ACR_LOGIN_SERVER <<< "$refresh_token"

    - name: Build and push Silo image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ${{ needs.provision.outputs.acr_login_server }}/${{ env.SILO_IMAGE_NAME }}:${{ github.sha }}
        file: ${{ env.SILO_DOCKER_FILE_PATH }}
    
    - name: Build and push Dashboard image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ${{ needs.provision.outputs.acr_login_server }}/${{ env.DASHBOARD_IMAGE_NAME }}:${{ github.sha }}
        file: ${{ env.DASHBOARD_DOCKER_FILE_PATH }}

    - name: Build and push Minimal Client image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ${{ needs.provision.outputs.acr_login_server }}/${{ env.MINIMAL_CLIENT_IMAGE_NAME }}:${{ github.sha }}
        file: ${{ env.MINIMAL_CLIENT_DOCKER_FILE_PATH }}

    - name: Build and push Worker Service Client image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ${{ needs.provision.outputs.acr_login_server }}/${{ env.WORKERSERVICE_CLIENT_IMAGE_NAME }}:${{ github.sha }}
        file: ${{ env.WORKERSERVICE_CLIENT_DOCKER_FILE_PATH }}

    - name: Build and push Scaler image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ${{ needs.provision.outputs.acr_login_server }}/${{ env.SCALER_IMAGE_NAME }}:${{ github.sha }}
        file: ${{ env.SCALER_DOCKER_FILE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: [provision, build]

    steps:

    - name: Checkout to the branch
      uses: actions/checkout@v2

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AzureSPN }}

    - name: Installing Container Apps extension
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Installing containerapp extension"

          az config set extension.use_dynamic_install=yes_without_prompt

          az extension add --name containerapp --yes

    - name: Set ACR Login Server from provision output
      run: echo "ACR_LOGIN_SERVER=${{ needs.provision.outputs.acr_login_server }}" >> $GITHUB_ENV

    - name: Deploy Silo
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Deploying Silo"
          
          az containerapp registry set -n silo -g ${{ env.RESOURCE_GROUP_NAME }} --server ${{ needs.provision.outputs.acr_login_server }}

          az containerapp update -n silo -g ${{ env.RESOURCE_GROUP_NAME }} -i ${{ needs.provision.outputs.acr_login_server }}/${{ env.SILO_IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy Dashboard
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Deploying Dashboard"
          
          az containerapp registry set -n dashboard -g ${{ env.RESOURCE_GROUP_NAME }} --server ${{ needs.provision.outputs.acr_login_server }}

          az containerapp update -n dashboard -g ${{ env.RESOURCE_GROUP_NAME }} -i ${{ needs.provision.outputs.acr_login_server }}/${{ env.DASHBOARD_IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy Minimal API Client
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Deploying Minimal API Client"
          
          az containerapp registry set -n minimalapiclient -g ${{ env.RESOURCE_GROUP_NAME }} --server ${{ needs.provision.outputs.acr_login_server }}

          az containerapp update -n minimalapiclient -g ${{ env.RESOURCE_GROUP_NAME }} -i ${{ needs.provision.outputs.acr_login_server }}/${{ env.MINIMAL_CLIENT_IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy Worker Service Client
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Deploying Worker Service Client"
          
          az containerapp registry set -n workerserviceclient -g ${{ env.RESOURCE_GROUP_NAME }} --server ${{ needs.provision.outputs.acr_login_server }}

          az containerapp update -n workerserviceclient -g ${{ env.RESOURCE_GROUP_NAME }} -i ${{ needs.provision.outputs.acr_login_server }}/${{ env.WORKERSERVICE_CLIENT_IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy Scaler
      uses: azure/CLI@v1
      with:
        inlineScript: >
          echo "Deploying Scaler"
          
          az containerapp registry set -n scaler -g ${{ env.RESOURCE_GROUP_NAME }} --server ${{ needs.provision.outputs.acr_login_server }}

          az containerapp update -n scaler -g ${{ env.RESOURCE_GROUP_NAME }} -i ${{ needs.provision.outputs.acr_login_server }}/${{ env.SCALER_IMAGE_NAME }}:${{ github.sha }}

    - name: logout
      run: >
        az logout
